<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>document.documentElement.className += " js";</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seite nicht gefunden — Certonis</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#05060B">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/main.css">
</head>
<body class="is-loaded">

<div class="atmosphere" aria-hidden="true"></div>
<canvas id="gl-canvas" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<main class="error-page">
  <div>
    <div class="error-page__code">404</div>
    <h1 style="font-size:clamp(1.6rem,3.5vw,2.6rem); margin-bottom:1rem;">Diese Seite gibt es nicht.</h1>
    <p class="lead" style="margin-inline:auto; margin-bottom:2.5rem;">Vielleicht hat sich die Adresse geändert — oder der Link war nie richtig. Zurück zum Anfang:</p>
    <div style="display:flex; gap:0.8rem; justify-content:center; flex-wrap:wrap;">
      <span class="magnetic"><a class="btn btn--primary btn--lg" href="/">Zur Startseite</a></span>
      <span class="magnetic"><a class="btn btn--ghost btn--lg" href="/#kontakt">Kontakt</a></span>
    </div>
  </div>
</main>

<script src="/js/gl.js" defer></script>
</body>
</html>
