name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated pages are up to date
        run: |
          node build.js
          if ! git diff --quiet -- '*.html' sitemap.xml; then
            echo "::error::Die erzeugten HTML-Dateien passen nicht zu src/."
            echo "Bitte lokal 'node build.js' ausführen und das Ergebnis committen."
            git --no-pager diff --stat -- '*.html' sitemap.xml
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
