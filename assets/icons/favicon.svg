<!-- Vereinfachte Bildmarke für kleine Größen (Suchergebnis, Tab, Lesezeichen).
     Der Ring der großen Marke löst sich unter 24 px in Rauschen auf, deshalb
     hier ein einzelner kräftiger Bogen mit Kern. Der helle Rand hält die
     Kachel auch auf dunklem Untergrund sichtbar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cg" x1="8" y1="40" x2="40" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22E3D2"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="#05060B"/>
  <rect x="0.9" y="0.9" width="46.2" height="46.2" rx="10.2" stroke="#FFFFFF33" stroke-width="1.8"/>
  <path d="M34.6 13.4A15 15 0 1 0 34.6 34.6" stroke="url(#cg)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="24" cy="24" r="3.4" fill="#22E3D2"/>
</svg>
