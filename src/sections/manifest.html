<!-- ======================================================= MANIFEST ==== -->
<section class="section" id="warum">
  <div class="shell">
    <div class="grid grid--2" style="align-items:start; gap:clamp(2rem,5vw,5rem);">
      <div>
        <span class="eyebrow reveal" data-i18n="manifest.eyebrow">Die Ausgangslage</span>
        <p class="manifest" data-manifest="Software,Monate,um." data-i18n="manifest.text">Ein ERP-Projekt scheitert selten an der Software. Es scheitert an Monaten voller Workshops, Angeboten ohne Ende und Beratern, die Ihr Geschäft nicht kennen. Wir drehen das um.</p>
      </div>
      <div class="reveal" style="--d:160ms;">
        <img src="/assets/img/flow-network.webp" alt="" width="1500" height="1000"
             loading="lazy" style="border-radius:var(--r-lg); opacity:0.9; mix-blend-mode:screen;">
        <div class="stats" style="margin-top:1.5rem; grid-template-columns:repeat(2,1fr);">
          <div class="stat">
            <div class="stat__value gradient-text"><span data-count="82" data-suffix=" %">82 %</span></div>
            <div class="stat__label" data-i18n="manifest.s1">weniger Beratertage als im klassischen ERP-Projekt</div>
          </div>
          <div class="stat">
            <div class="stat__value gradient-text"><span data-count="1" data-suffix=" Tag">1 Tag</span></div>
            <div class="stat__label" data-i18n="manifest.s2">von der Datenübergabe zur ersten Analyse</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
