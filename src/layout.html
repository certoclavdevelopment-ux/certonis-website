<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>document.documentElement.className += " js";</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="Certonis GmbH">
<meta name="theme-color" content="#05060B">
<meta name="build" content="{{build}}">
<link rel="canonical" href="https://certonis.com/{{path}}">
<meta name="robots" content="{{robots}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Certonis">
<meta property="og:locale" content="de_AT">
<meta property="og:url" content="https://certonis.com/{{path}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://certonis.com/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Certonis — Odoo ERP, eingerichtet von KI">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="https://certonis.com/assets/img/og.jpg">

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icons/favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preload" href="/assets/fonts/manrope-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/main.css">

{{jsonld}}
</head>

<body{{bodyclass}}>
<a class="skip-link" href="#main" data-i18n="a11y.skip">Zum Inhalt springen</a>
{{preloader}}
<div class="atmosphere" aria-hidden="true"></div>
<canvas id="gl-canvas" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="scroll-progress" aria-hidden="true"></div>

{{nav}}

<main id="main">
{{body}}
</main>

{{footer}}

<script src="/js/config.js" defer></script>
<script src="/js/i18n.js" defer></script>
<script src="/js/app.js" defer></script>
{{formscript}}
<script src="/js/gl.js" defer></script>
</body>
</html>
